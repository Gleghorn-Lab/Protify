# ID
hf_username: Synthyra
hf_token: null
synthyra_api_key: null
wandb_api_key: null


# Random seeds
seed: !!int 42
deterministic: !!bool false

# Paths
yaml_path: null
log_dir: logs
results_dir: results
model_save_dir: weights
embedding_save_dir: embeddings
download_dir: Synthyra/mean_pooled_embeddings
plots_dir: plots
replay_path: null


# DataArguments:
delimiter: ','
col_names:
  - seqs
  - labels
max_length: !!int 1024
padding: max_length  # 'max_length' (recommended) or 'longest'
trim: !!bool false
data_names:
  - DeepLoc-2
data_dirs: []


# BaseModelArguments:
# ESMC-300-SAE resolves to ESMC-300-SAE-l23-k64-c8192: ESMC 300M read through the Biohub
# sparse autoencoder at layer 23. Max pooling over its codebook gives sparse features that
# suit the xgboost probe below. Swap in ESM2-8 for a small dense-embedding baseline.
model_names:
  - ESMC-300-SAE
# Other ESMC sparse autoencoders: ESMC-600-SAE and ESMC-6B-SAE. A bare alias resolves to
# the 75% depth layer each backbone publishes (23, 27, and 60). The three settings below
# override that; leave them null for the defaults.
sae_layer: null           # any layer 0..n_layers, but only at k 64 and codebook 16384
sae_k: null               # 16, 32, 64, 128, 256, or 512; depth layer only for non-64
sae_codebook_dim: null    # 8192, 16384, 32768, 65536, or 131072; depth layer only
# Alternative: use model_paths + model_types instead of model_names (mutually exclusive)
# model_paths:
#   - answerdotai/ModernBERT-base
# model_types:
#   - custom


# ProbeArguments:
probe_type: xgboost  # valid options: mlp, transformer, lyra, xgboost, lightgbm, random_forest ("linear" is the former name for mlp)
tokenwise: !!bool false
probe_n_jobs: !!int -1  # workers for xgboost, lightgbm, and random_forest probes
hidden_size: !!int 8192
dropout: !!float 0.2
n_layers: !!int 1
sim_type: dot #valid options: dot, cosine, euclidean
pre_ln: !!bool true
classifier_size: !!int 4096
transformer_dropout: !!float 0.1
classifier_dropout: !!float 0.2
head_size: !!int 2048  # n_heads = hidden_size // head_size; 8192/2048=4 to match the prior default. `n_heads` is deprecated; use `head_size` instead.
rotary: !!bool true
attention_backend: flex
output_s_max: !!bool false
probe_pooling_types:
  - cls
save_model: !!bool false
push_raw_probe: !!bool false
production_model: !!bool false
use_lora: !!bool false
lora_r: !!int 8
lora_alpha: !!float 32.0
lora_dropout: !!float 0.01


# ScikitArguments:
scikit_n_iter: !!int 10
scikit_cv: !!int 3
scikit_random_state: !!int 42
scikit_model_name: null
use_scikit: !!bool false
n_jobs: !!int 1


# EmbeddingArguments:
embedding_batch_size: !!int 4
num_workers: !!int 0
download_embeddings: !!bool false
matrix_embed: !!bool false
# SAE models accept max, mean, and sum only, and pool inside their encoder pass.
# Dense embedding models accept the full set in pooler.py.
embedding_pooling_types:
  - max
embedding_hidden_state_index: !!int -1
save_embeddings: !!bool false
embed_dtype: !!str float32
embedding_scaler: !!bool true  # StandardScaler for pooled vector embeddings during probe/scikit training; disable with --no_embedding_scaler
sql: !!bool false
read_scaler: !!int 100


# TrainerArguments:
num_epochs: !!int 200
probe_batch_size: !!int 64
base_batch_size: !!int 4
probe_grad_accum: !!int 1
base_grad_accum: !!int 8
lr: !!float 1e-4
probe_lr: null
base_lr: null
lr_scheduler: cosine
optimizer: adamw_torch
weight_decay: !!float 0.00
patience: !!int 1
base_num_epochs: null
base_patience: null
full_finetuning: !!bool false
hybrid_probe: !!bool false
num_runs: !!int 1
parallel_probe_runs: !!bool false
parallel_probe_batch_mode: shared  # shared | run_specific
parallel_probe_index_strategy: permutation  # permutation | affine
parallel_probe_max_group_size: null
parallel_probe_training_state_budget_gb: null
parallel_probe_estimated_peak_budget_gb: null
parallel_probe_max_grad_norm: !!float 0.0  # 0 disables global clipping across seed banks
parallel_probe_grad_clip_mode: global  # none | global | per_run
parallel_probe_ensemble_average_mode: logits  # logits | probabilities

# Balanced regression metrics (EpHod-style; ignored for non-regression tasks)
balanced_regression_metrics: !!bool true
balanced_weight_method: bin_inv  # none | bin_inv | bin_inv_sqrt | LDS_inv | LDS_inv_sqrt | LDS_extreme
balanced_bin_borders: null  # e.g. [5, 9] for pH; null -> 1/3 and 2/3 quantiles of train labels
balanced_n_resamples: !!int 100
balanced_lds_bins: !!int 100
balanced_lds_ks: !!int 5
balanced_lds_sigma: !!float 2.0
